<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị máy chủ</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef2ff;font:15px Arial,sans-serif}
main{max-width:1050px;margin:35px auto;padding:20px}.panel{background:#1d293b;padding:20px;border-radius:14px;margin:14px 0}
input,button,textarea{padding:11px;border:0;border-radius:8px;margin:5px 4px 5px 0}
input,textarea{background:#0f172a;color:white;border:1px solid #475569}button{cursor:pointer;background:#6d5dfc;color:white;font-weight:bold}
.danger{background:#c0392b}.muted{color:#aab6cc}.hidden{display:none}.item{padding:10px;border-bottom:1px solid #334155}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{font-size:28px;font-weight:bold}
</style></head><body><main><h1>🎮 Bảng quản trị máy chủ</h1><p class="muted">Đăng nhập bằng ADMIN_USERNAME và ADMIN_PASSWORD đã đặt trong Render Environment.</p>
<section id="login" class="panel"><h3>Đăng nhập admin</h3><input id="username" placeholder="Tên admin" value="admin"><input id="password" type="password" placeholder="Mật khẩu"><button onclick="login()">Đăng nhập</button><p id="error"></p></section>
<section id="dashboard" class="hidden"><div class="grid">
<div class="panel">Người chơi online<div class="stat" id="online">0</div></div>
<div class="panel">Phòng đang mở<div class="stat" id="roomCount">0</div></div>
<div class="panel">Trạng thái máy chủ<div class="stat" id="locked">Mở</div><button id="lockBtn" onclick="toggleLock()">Khóa / Mở</button></div>
</div>
<div class="panel"><h3>Thông báo toàn máy chủ</h3><textarea id="announcement" rows="2" style="width:100%" placeholder="Nhập thông báo..."></textarea><button onclick="sendAnnouncement()">Gửi thông báo</button></div>
<div class="panel"><h3>Người chơi</h3><div id="players"></div></div>
<div class="panel"><h3>Phòng</h3><div id="rooms"></div></div>
<button class="danger" onclick="logout()">Đăng xuất</button></section></main>
<script>
let token="", state={};
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Có lỗi");return d}
async function login(){try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;document.getElementById("login").classList.add("hidden");document.getElementById("dashboard").classList.remove("hidden");await refresh();setInterval(refresh,3000)}catch(e){document.getElementById("error").textContent=e.message}}
async function refresh(){try{state=await api("/api/admin/state");render()}catch(e){}}
function render(){document.getElementById("online").textContent=state.online.length;document.getElementById("roomCount").textContent=state.rooms.length;document.getElementById("locked").textContent=state.locked?"Đã khóa":"Đang mở";document.getElementById("announcement").value=state.announcement||"";
document.getElementById("players").innerHTML=state.online.map(p=>`<div class="item">${esc(p.name)} — ${esc(p.id)} — Phòng: ${esc(p.room||"Chưa vào phòng")} <button class="danger" onclick="kick('${esc(p.id)}')">Ngắt kết nối</button></div>`).join("")||"Chưa có người chơi";
document.getElementById("rooms").innerHTML=state.rooms.map(r=>`<div class="item">Phòng ${esc(r.id)} — ${r.players.length} người</div>`).join("")||"Chưa có phòng"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function toggleLock(){await api("/api/admin/lock",{locked:!state.locked});refresh()}
async function sendAnnouncement(){await api("/api/admin/announcement",{message:document.getElementById("announcement").value});alert("Đã gửi thông báo")}
async function kick(id){if(confirm("Ngắt kết nối người chơi này?")){await api("/api/admin/kick",{socketId:id});refresh()}}
function logout(){token="";location.reload()}
</script></body></html>
