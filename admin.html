<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><title>Admin Panel</title>
<style>
body{background:#0a0e14;color:#eee;font-family:Arial;padding:20px;margin:0}
.container{max-width:900px;margin:auto}
.login-box{background:#1a2533;padding:30px;border-radius:12px;max-width:400px;margin:50px auto;text-align:center}
input{padding:12px;width:100%;margin-bottom:10px;border-radius:6px;border:1px solid #444;background:#0d1622;color:#fff;box-sizing:border-box}
button{padding:12px 20px;background:#2ecc71;border:none;border-radius:6px;color:#fff;font-weight:bold;cursor:pointer;width:100%}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;background:#0d1622;margin-top:20px}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left}
th{background:#1a2533}
.btn-danger{background:#e74c3c;padding:5px 10px;font-size:12px;width:auto}
.btn-info{background:#3498db;padding:5px 10px;font-size:12px;width:auto}
</style>
</head>
<body>
<div class="container">
  <div id="loginSection" class="login-box">
    <h2>🛡️ ADMIN LOGIN</h2>
    <input type="text" id="user" placeholder="Tài khoản (admin)" value="admin">
    <input type="password" id="pass" placeholder="Mật khẩu (admin123)" value="admin123">
    <button onclick="login()">Đăng nhập</button>
    <p id="err" style="color:red"></p>
  </div>

  <div id="dashboardSection" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Danh sách phòng</h2>
      <button onclick="logout()" style="width:100px;background:#7f8c8d">Đăng xuất</button>
    </div>
    <button onclick="loadRooms()" style="width:150px;background:#3498db">Làm mới</button>
    <table>
      <thead><tr><th>ID Phòng</th><th>Số người</th><th>Hành động</th></tr></thead>
      <tbody id="roomsBody"></tbody>
    </table>
    
    <h3 id="titlePlayers" class="hidden" style="margin-top:30px">Người chơi trong phòng</h3>
    <table id="playersTable" class="hidden">
      <thead><tr><th>Tên</th><th>Đội</th><th>IP</th><th>Hành động</th></tr></thead>
      <tbody id="playersBody"></tbody>
    </table>
  </div>
</div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const SERVER_URL = window.location.origin;
let socket, token = localStorage.getItem('adminToken');

async function login() {
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;
  try {
    const res = await fetch(SERVER_URL + '/api/admin/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (data.token) {
      token = data.token;
      localStorage.setItem('adminToken', token);
      showDash();
    } else {
      document.getElementById('err').textContent = data.error;
    }
  } catch(e) { document.getElementById('err').textContent = "Lỗi kết nối server"; }
}

function logout() {
  localStorage.removeItem('adminToken');
  location.reload();
}

function showDash() {
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('dashboardSection').classList.remove('hidden');
  socket = io(SERVER_URL, { auth: { token } });
  socket.on('connect', () => loadRooms());
  socket.on('admin:roomList', renderRooms);
  socket.on('admin:playerList', renderPlayers);
  socket.on('admin:success', (msg) => alert(msg));
}

function loadRooms() { if(socket) socket.emit('admin:getRooms'); }

function renderRooms(list) {
  document.getElementById('roomsBody').innerHTML = list.map(r => `
    <tr>
      <td><b>${r.id}</b></td>
      <td>${r.count}</td>
      <td><button class="btn-info" onclick="viewPlayers('${r.id}')">Xem</button></td>
    </tr>
  `).join('');
}

function viewPlayers(roomId) {
  socket.emit('admin:getPlayers', roomId);
}

function renderPlayers({ roomId, players }) {
  document.getElementById('titlePlayers').classList.remove('hidden');
  document.getElementById('playersTable').classList.remove('hidden');
  document.getElementById('titlePlayers').textContent = 'Người chơi trong phòng ' + roomId;
  
  document.getElementById('playersBody').innerHTML = players.map(p => `
    <tr>
      <td>${p.username}</td>
      <td>${p.team === 'red' ? '🔴 Đỏ' : '🔵 Xanh'}</td>
      <td>${p.ip || 'N/A'}</td>
      <td>
        <button class="btn-info" onclick="grant('${p.id}')">+HP</button>
        <button class="btn-danger" onclick="ban('${p.id}','${p.username}','${p.ip}')">Ban</button>
      </td>
    </tr>
  `).join('');
}

function ban(id, name, ip) {
  if(confirm('Ban ' + name + '?')) socket.emit('admin:ban', { targetId: id, username: name, ip: ip });
}
function grant(id) {
  socket.emit('admin:grant', { targetId: id, type: 'health', value: 100 });
}

if (token) showDash();
</script>
</body>
</html>
